[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resonant-chemistry"
version = "0.1.0"
description = "Foundational relational chemistry with standard quantum-chemistry control layers"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0"]

[tool.setuptools.packages.find]
include = ["reschem*"]
