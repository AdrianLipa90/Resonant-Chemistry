name: polyhedral-eclipse-v0.15-stage-a0-r2

on:
  push:
    branches:
      - chem/v0.15-polyhedral-eclipse-spectroscopy
    paths:
      - .github/workflows/polyhedral-eclipse-v0.15-stage-a0-r2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-stage-a0-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Resonant Chemistry core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip check

      - name: Freeze Stage-A0 R2 axis-resolved geometry
        run: >-
          python scripts/run_polyhedral_eclipse_stage_a0_v015.py
          --output /tmp/POLYHEDRAL_ECLIPSE_STAGE_A0_R2_LEDGER_V0_15.json
          --sample-count 8192
          --phase-samples 128

      - name: Validate frozen R2 ledger and nested hashes
        run: >-
          python scripts/validate_polyhedral_eclipse_stage_a0_r2_v015.py
          /tmp/POLYHEDRAL_ECLIPSE_STAGE_A0_R2_LEDGER_V0_15.json

      - name: Upload Stage-A0 R2 frozen ledger
        uses: actions/upload-artifact@v4
        with:
          name: polyhedral-eclipse-v0.15-stage-a0-r2-ledger
          path: /tmp/POLYHEDRAL_ECLIPSE_STAGE_A0_R2_LEDGER_V0_15.json
          if-no-files-found: error
          retention-days: 90
