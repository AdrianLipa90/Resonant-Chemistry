name: period2-active-ci

on:
  push:
    branches:
      - period2-correlation-ci-v0.1
  workflow_dispatch:

jobs:
  test-period2-active-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run active-CI tests
        run: python -m unittest tests.test_period2_active_ci -v
