name: period2-active-ci

on:
  push:
    branches:
      - period2-correlation-ci-v0.1
  workflow_dispatch:

jobs:
  test-period2-active-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run active-CI, correlated-spectrum, and convergence tests
        run: python -m unittest tests.test_period2_active_ci tests.test_period2_correlated_spectrum tests.test_period2_active_convergence -v
      - name: Print carbon active-space convergence
        run: |
          python - <<'PY'
          import json
          from reschem.period2_active_convergence import solve_carbon_active_space_convergence
          points = solve_carbon_active_space_convergence(radial_spaces=(2,3,4), basis_size=18, grid_points=800)
          print("RESCHEM_CARBON_ACTIVE_SPACE_CONVERGENCE=" + json.dumps([p.as_dict() for p in points], sort_keys=True))
          PY
