name: Chemical Berry loop positive control

on:
  pull_request:
    paths:
      - 'THEORY/17_CHEMICAL_BERRY_LOOP_POSITIVE_CONTROL_V0_1.md'
      - 'benchmarks/CHEMICAL_BERRY_LOOP_CONTROL_V0_1.json'
      - 'reschem/chemical_berry_loop_control_v01.py'
      - 'tests/test_chemical_berry_loop_control_v01.py'
      - '.github/workflows/chemical-berry-loop-control-v01.yml'
  workflow_dispatch:

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Run Berry-loop controls
        run: python -m unittest -v tests.test_chemical_berry_loop_control_v01
