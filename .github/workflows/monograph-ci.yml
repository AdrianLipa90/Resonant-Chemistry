name: resonant-chemistry-textbook

on:
  push:
    branches:
      - main
    paths-ignore:
      - Resonant_Chemistry.pdf
      - TEXTBOOK_BUILD_PROVENANCE.json
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-build-textbook:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate package metadata install
        run: |
          python -m pip install .
          python -m pip check

      - name: Run complete Python test discovery
        run: python -m unittest discover -s tests -v

      - name: Audit semantic-card coverage
        run: python -m scripts.audit_semantic_card_coverage

      - name: Audit semantic THEORY web parity
        run: python -m scripts.audit_semantic_surface_sync

      - name: Run production carbon state-averaged p-relaxation benchmark
        run: |
          PYTHONPATH=. python scripts/benchmark_carbon_state_averaged_p_relaxation.py \
            --basis-size 18 \
            --grid-points 800 \
            --tolerance-hartree 1e-9 \
            --coarse-points 21 \
            --theta-limit 1.45 \
            --refine-points 11 \
            --output ci_artifacts/CARBON_STATE_AVERAGED_P_RELAXATION_V0_1.json

      - name: Audit required repository areas
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              Path('THEORY'), Path('benchmarks'), Path('docs'), Path('monograph/chapters'),
              Path('monograph/bibliography'), Path('reschem'), Path('tests'), Path('semantic_cards'),
              Path('web'), Path('.github/workflows')
          ]
          missing = [str(p) for p in required if not p.is_dir()]
          empty = [str(p) for p in required if p.is_dir() and not any(x.is_file() for x in p.rglob('*'))]
          placeholders = [str(p) for p in Path('.').rglob('.gitkeep')]
          print({'missing': missing, 'empty': empty, 'gitkeep': placeholders})
          if missing or empty:
              raise SystemExit(2)
          PY

      - name: Audit live bibliography
        run: python scripts/audit_compound_bibliography.py

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended poppler-utils

      - name: Build complete Resonant Chemistry textbook
        working-directory: monograph
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main.tex

      - name: Reject unresolved bibliography or cross-references
        working-directory: monograph
        run: |
          if grep -E "LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|There were undefined citations|I couldn't open database file" main.log; then
            echo "Undefined bibliography or cross-reference state remains"
            exit 3
          fi
          test -s main.pdf
          test -s main.bbl
          pdfinfo main.pdf | tee pdfinfo.txt

      - name: Record build hashes
        run: |
          sha256sum monograph/main.tex monograph/bibliography/*.bib monograph/main.bbl monograph/main.pdf > monograph/TEXTBOOK_SHA256.txt
          cat monograph/TEXTBOOK_SHA256.txt
          sha256sum ci_artifacts/CARBON_STATE_AVERAGED_P_RELAXATION_V0_1.json > ci_artifacts/CARBON_STATE_AVERAGED_P_RELAXATION_V0_1.sha256
          cat ci_artifacts/CARBON_STATE_AVERAGED_P_RELAXATION_V0_1.sha256

      - name: Prepare canonical root textbook
        run: |
          cp monograph/main.pdf Resonant_Chemistry.pdf
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          payload = {
              "schema": "RESCHEM_ROOT_TEXTBOOK_BUILD_PROVENANCE_V1",
              "source_of_truth": "repository main",
              "source_commit": os.environ["GITHUB_SHA"],
              "source_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "source_main_tex_sha256": sha256("monograph/main.tex"),
              "semantic_coverage_sha256": sha256("semantic_cards/SEMANTIC_CARD_COVERAGE_V0_14A1.json"),
              "root_pdf": "Resonant_Chemistry.pdf",
              "root_pdf_sha256": sha256("Resonant_Chemistry.pdf"),
              "epistemic_status": "BUILD_ARTIFACT_ONLY_NO_SCIENTIFIC_PROMOTION",
          }
          Path("TEXTBOOK_BUILD_PROVENANCE.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload complete textbook
        uses: actions/upload-artifact@v4
        with:
          name: Resonant-Chemistry-Textbook-current
          path: |
            Resonant_Chemistry.pdf
            TEXTBOOK_BUILD_PROVENANCE.json
            monograph/main.pdf
            monograph/main.log
            monograph/main.bbl
            monograph/pdfinfo.txt
            monograph/TEXTBOOK_SHA256.txt
            ci_artifacts/CARBON_STATE_AVERAGED_P_RELAXATION_V0_1.json
            ci_artifacts/CARBON_STATE_AVERAGED_P_RELAXATION_V0_1.sha256
          if-no-files-found: error

      - name: Publish current textbook at repository root
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Resonant_Chemistry.pdf TEXTBOOK_BUILD_PROVENANCE.json
          if git diff --cached --quiet; then
            echo "Root textbook is already current"
            exit 0
          fi
          git commit -m "Update canonical root textbook PDF [skip ci]"
          git push origin HEAD:main
