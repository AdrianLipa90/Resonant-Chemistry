name: Aluminium 3p targeted validation

on:
  push:
    branches:
      - ci/validate-aluminium-3p-r2-20260920
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Al 3p and OES export regression
        run: |
          python -m unittest tests.test_atomic_pblock_radial_v015 -v
          python -m unittest tests.test_oes_transition_export -v
