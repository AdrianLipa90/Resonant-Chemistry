name: Candidate QGT spectroscopy v0.1

on:
  push:
    branches:
      - candidate/600cell-working-layer-v0.1-20260911
    paths:
      - 'reschem/qgt_spectroscopy_bridge_v01.py'
      - 'tests/test_qgt_spectroscopy_bridge_v01.py'
      - 'docs/PHASENAV_QGT_SPECTROSCOPY_BRIDGE_V0_1.md'
      - '.github/workflows/candidate-qgt-spectroscopy-v01.yml'
  pull_request:
    paths:
      - 'reschem/qgt_spectroscopy_bridge_v01.py'
      - 'tests/test_qgt_spectroscopy_bridge_v01.py'
      - 'docs/PHASENAV_QGT_SPECTROSCOPY_BRIDGE_V0_1.md'
      - '.github/workflows/candidate-qgt-spectroscopy-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spectroscopy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install --upgrade pytest numpy
      - name: Run QGT spectroscopy candidate gate
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_qgt_spectroscopy_bridge_v01.py
