name: polyhedral-eclipse-v0.15-persist-stage-d0-subjective-time

on:
  push:
    branches:
      - chem/v0.15-polyhedral-eclipse-spectroscopy
    paths:
      - .github/workflows/polyhedral-eclipse-v0.15-persist-stage-d0-subjective-time.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  persist-exact-stage-d0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chem/v0.15-polyhedral-eclipse-spectroscopy

      - name: Download exact Stage-D0 artifact from canonical run
        uses: actions/download-artifact@v4
        with:
          name: atomic-subjective-time-v0.15-stage-d0-ledger
          path: recovered
          github-token: ${{ github.token }}
          repository: AdrianLipa90/Resonant-Chemistry
          run-id: 32900270804

      - name: Verify exact recovered Stage-D0 ledger and nested receipts
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          source=Path('recovered/ATOMIC_SUBJECTIVE_TIME_STAGE_D0_LEDGER_V0_15.json')
          raw=source.read_bytes()
          raw_sha=hashlib.sha256(raw).hexdigest()
          expected_raw_sha='70da8b6dbddcbb01e8d65178fac6bf6dedbc92d449aae6b44ad19bc777915890'
          if raw_sha!=expected_raw_sha: raise SystemExit(f'raw Stage-D0 drift: {raw_sha} != {expected_raw_sha}')
          d=json.loads(raw)
          if d['status']!='MODEL_SIDE_SUBJECTIVE_TIME_HYPOTHESES_FROZEN_FOR_FUTURE_HOLDOUT': raise SystemExit('status drift')
          if d['stage_c_result_used_as_input'] is not False or d['nist_values_used_as_input'] is not False: raise SystemExit('observed-data boundary drift')
          if d['fit_parameters']!=[] or d['calibration_parameters']!=[]: raise SystemExit('fit/calibration drift')
          if d['interpretation']!='NONE_IN_MODEL_SIDE_LEDGER': raise SystemExit('interpretation boundary drift')
          def canonical(v): return json.dumps(v,sort_keys=True,separators=(',',':'),ensure_ascii=False,allow_nan=False)
          body=dict(d); recorded=body.pop('ledger_sha256')
          if hashlib.sha256(canonical(body).encode()).hexdigest()!=recorded: raise SystemExit('ledger SHA drift')
          if recorded!='0dfc0c98ab24231cf5a5edb436c186b13509bf5af111119aad8d0cc970fc4744': raise SystemExit('canonical ledger SHA mismatch')
          for row in d['rows']:
              rb=dict(row); rr=rb.pop('row_sha256')
              if hashlib.sha256(canonical(rb).encode()).hexdigest()!=rr: raise SystemExit(f"row SHA drift: {row['symbol']}")
              for candidate in row['candidates']:
                  cb=dict(candidate); cr=cb.pop('candidate_sha256')
                  if hashlib.sha256(canonical(cb).encode()).hexdigest()!=cr: raise SystemExit(f"candidate SHA drift: {row['symbol']}:{candidate['policy_id']}")
          destination=Path('benchmarks/ATOMIC_SUBJECTIVE_TIME_STAGE_D0_LEDGER_V0_15.json')
          destination.write_bytes(raw)
          print({'raw_json_sha256':raw_sha,'ledger_sha256':recorded,'rows':len(d['rows'])})
          PY

      - name: Persist exact verified Stage-D0 bytes on experiment branch
        run: |
          git config user.name "Adrian Lipa"
          git config user.email "adrianlipa90@gmail.com"
          git add benchmarks/ATOMIC_SUBJECTIVE_TIME_STAGE_D0_LEDGER_V0_15.json
          git diff --cached --quiet && exit 0
          git commit -m "evidence: persist exact v0.15 Stage-D0 subjective-time ledger"
          git push origin HEAD:chem/v0.15-polyhedral-eclipse-spectroscopy
