name: atomic-pblock-diagnostic

on:
  push:
    branches:
      - fix/textbook-provenance-publish-20260905
    paths:
      - .github/workflows/atomic-pblock-diagnostic.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Measure Al 3p radial density consistency
        run: |
          python - <<'PY'
          import numpy as np
          from reschem.atomic_pblock_radial_v015 import solve_neutral_pblock_radial_state
          from reschem.atomic_kepler_phase_v015 import radial_kepler_observables

          state = solve_neutral_pblock_radial_state(
              13, '3p', basis_size=16, grid_points=700, mixing=0.32,
              tolerance_hartree=2.0e-7, max_iterations=120,
          )
          r = state['r']; w = state['weights']; total = state['density']; one = state['one_p_density']
          other = total - one
          i = int(np.argmin(other))
          print('total_norm=', float(np.sum(w * total)))
          print('one_norm=', float(np.sum(w * one)))
          print('other_norm=', float(np.sum(w * other)))
          print('other_min=', float(other[i]))
          print('other_min_r=', float(r[i]))
          print('total_at_min=', float(total[i]))
          print('one_at_min=', float(one[i]))
          print('max_abs_total=', float(np.max(np.abs(total))))
          print('min_total=', float(np.min(total)))
          try:
              print('observables=', radial_kepler_observables(13, r=r, weights=w, total_radial_density=total, one_p_density=one))
          except Exception as exc:
              print(type(exc).__name__, str(exc))
          PY
