name: atomic-pblock-repair

on:
  push:
    branches:
      - fix/textbook-provenance-publish-20260905
    paths:
      - .github/workflows/atomic-pblock-diagnostic.yml

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/textbook-provenance-publish-20260905
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply exact fail-closed p-block repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('reschem/atomic_pblock_radial_v015.py')
          text = path.read_text(encoding='utf-8')

          old_shell = '''    p_shell = next((shell for shell in subshells if shell.label == active_p_shell), None)\n    if p_shell is None or p_shell.l != 1 or p_shell.occupancy <= 0:\n        raise AtomicPBlockRadialV015Error(\n            f"active p shell {active_p_shell!r} is absent from neutral Z={zz} configuration"\n        )\n'''
          new_shell = '''    occupied_p_shells = [shell for shell in subshells if shell.l == 1 and shell.occupancy > 0]\n    p_shell = max(occupied_p_shells, key=lambda shell: shell.n, default=None)\n    if p_shell is None or p_shell.label != active_p_shell:\n        raise AtomicPBlockRadialV015Error(\n            f"active p shell {active_p_shell!r} is not the outermost occupied p shell for neutral Z={zz}"\n        )\n'''

          old_density = '''    one_p_density /= one_p_normalization\n\n    return {\n'''
          new_density = '''    one_p_density /= one_p_normalization\n\n    # Preserve exact 2p legacy replay while making the lifted n>2 state\n    # decomposition-consistent on the numerical quadrature used by observables.\n    if n_active > 2:\n        other_density = density - p_density\n        if float(np.min(other_density)) < -1.0e-12:\n            raise RuntimeError("non-active radial density became negative beyond roundoff tolerance")\n        density = np.maximum(other_density, 0.0) + float(p_shell.occupancy) * one_p_density\n\n    return {\n'''

          if text.count(old_shell) != 1:
              raise SystemExit('FAIL: active-shell anchor is not unique')
          if text.count(old_density) != 1:
              raise SystemExit('FAIL: density-normalization anchor is not unique')

          text = text.replace(old_shell, new_shell, 1)
          text = text.replace(old_density, new_density, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run p-block regression tests
        run: python -m unittest tests.test_atomic_pblock_radial_v015 -v

      - name: Run complete Python test discovery
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit validated repair and remove one-shot workflow
        run: |
          git rm .github/workflows/atomic-pblock-diagnostic.yml
          git add reschem/atomic_pblock_radial_v015.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair lifted p-block active-shell density contract"
          git push origin HEAD:fix/textbook-provenance-publish-20260905
