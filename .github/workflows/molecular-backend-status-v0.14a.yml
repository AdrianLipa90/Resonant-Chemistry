name: molecular-backend-status-v0.14a

# Frozen experiment replay: no automatic branch trigger.
on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  backend-status:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mark backend check pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA} \
            -f state=pending \
            -f context='reschem/v0.14a-backend' \
            -f description='Running frozen B97M-V/VV10/def2-TZVPD smoke'

      - name: Install exact frozen backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyscf==2.14.0" "geometric==1.1.1"

      - name: Run structured smoke
        id: smoke
        continue-on-error: true
        run: python scripts/smoke_molecular_backend_v0_14a.py

      - name: Summarize structured receipt
        id: receipt
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('benchmarks/MOLECULAR_BACKEND_SMOKE_V0_14A.json')
          if not path.is_file():
              status = 'FAIL'
              description = 'receipt missing after backend smoke'
          else:
              payload = json.loads(path.read_text(encoding='utf-8'))
              status = payload.get('status', 'FAIL')
              failed = next((x for x in payload.get('steps', []) if x.get('status') == 'FAIL'), None)
              if status == 'PASS':
                  description = 'PASS: frozen backend energy+gradient smoke'
              elif failed:
                  description = f"FAIL: {failed.get('step','unknown')} {failed.get('exception_type','')}"
              else:
                  description = 'FAIL: backend smoke'
          description = description[:140]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"status={status}\n")
              handle.write(f"description={description}\n")
          print({'status': status, 'description': description})
          PY

      - name: Upload structured smoke receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: molecular-backend-status-v0.14a
          path: benchmarks/MOLECULAR_BACKEND_SMOKE_V0_14A.json
          if-no-files-found: warn

      - name: Publish durable commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_STATUS: ${{ steps.receipt.outputs.status }}
          RECEIPT_DESCRIPTION: ${{ steps.receipt.outputs.description }}
        run: |
          if [ "${RECEIPT_STATUS}" = "PASS" ]; then state=success; else state=failure; fi
          gh api --method POST \
            repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA} \
            -f state="${state}" \
            -f context='reschem/v0.14a-backend' \
            -f description="${RECEIPT_DESCRIPTION}"

      - name: Enforce backend compatibility
        if: steps.receipt.outputs.status != 'PASS'
        run: exit 2
