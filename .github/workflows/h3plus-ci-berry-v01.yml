name: H3+ conical-intersection Berry benchmark

on:
  pull_request:
    paths:
      - 'THEORY/18_H3PLUS_CI_BERRY_BENCHMARK_V0_1.md'
      - 'benchmarks/H3PLUS_CI_BERRY_PREREG_V0_1.json'
      - 'reschem/h3plus_ci_berry_control_v01.py'
      - 'scripts/run_h3plus_ci_berry_control_v01.py'
      - 'tests/test_h3plus_ci_berry_control_v01.py'
      - '.github/workflows/h3plus-ci-berry-v01.yml'
  workflow_dispatch:

jobs:
  standard-qm-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and frozen PySCF backend
        run: python -m pip install -e . pyscf==2.14.0
      - name: Run structural unit controls
        run: python -m unittest -v tests.test_h3plus_ci_berry_control_v01
      - name: Execute preregistered H3+ FCI Berry loop
        run: python scripts/run_h3plus_ci_berry_control_v01.py --output build/H3PLUS_CI_BERRY_RESULT_V0_1.json
      - name: Upload result receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h3plus-ci-berry-v0.1-result
          path: build/H3PLUS_CI_BERRY_RESULT_V0_1.json
          if-no-files-found: warn
