name: closed-shell-atomic-control-v0.11

on:
  push:
    branches:
      - compound-relations-v0.3
    paths:
      - reschem/closed_shell_atomic_control.py
      - scripts/run_closed_shell_atomic_control_v0_11.py
      - benchmarks/CLOSED_SHELL_ATOMIC_CONTROL_PREREG_V0_11.json
      - .github/workflows/closed-shell-atomic-control.yml
  workflow_dispatch:

jobs:
  atomic-control:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Execute frozen v0.11 atomic control vector
        id: control
        continue-on-error: true
        run: python scripts/run_closed_shell_atomic_control_v0_11.py

      - name: Validate output JSON if produced
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('benchmarks/CLOSED_SHELL_ATOMIC_CONTROL_V0_11.json')
          if not path.is_file():
              raise SystemExit('v0.11 output JSON was not produced')
          payload = json.loads(path.read_text(encoding='utf-8'))
          assert payload['candidate_count'] == 9
          assert len(payload['vectors']) == 9
          print({
              'status': payload['status'],
              'candidate_count': payload['candidate_count'],
              'all_quality_pass': all(v['all_atomic_quality_pass'] for v in payload['vectors']),
          })
          PY

      - name: Upload v0.11 raw control receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closed-shell-atomic-control-v0.11
          path: benchmarks/CLOSED_SHELL_ATOMIC_CONTROL_V0_11.json
          if-no-files-found: error

      - name: Enforce physical quality result
        if: steps.control.outcome != 'success'
        run: |
          echo 'The frozen atomic-control runner reported one or more quality failures.'
          exit 2
